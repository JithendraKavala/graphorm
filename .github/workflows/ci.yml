name: CI

on:
  push:
    branches:
      - master
      - 'fix/**'
      - 'feat/**'
  pull_request:
    branches:
      - master

jobs:
  build:
    name: Maven Build & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ""
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Prepare PostgreSQL databases
        run: |
          docker exec $(docker ps --filter "ancestor=postgres:16-alpine" -q | head -n 1) psql -U postgres -c "CREATE DATABASE university_db;" || true

      - name: Run Maven Tests
        run: mvn -B clean test
