server:
  port: 8080

spring:
  application:
    name: graphorm-example-university-dashboard
  datasource:
    url: jdbc:postgresql://localhost:5432/university_db
    username: postgres
    password: ""
    driver-class-name: org.postgresql.Driver
  graphql:
    graphiql:
      enabled: true
      path: /graphiql
    schema:
      printer:
        enabled: true

graphorm:
  schema-location: classpath:schema.graphorm
  dialect: postgresql
  sql-logging: true
  migration:
    enabled: true
    location: classpath:migrations
  cache:
    enabled: true
    l2-type: caffeine
    caffeine:
      maximum-size: 500
      default-ttl: 60s
  tenant:
    enabled: true
    header-name: X-Tenant-ID
  subscriptions:
    enabled: true
    channel-name: graphorm_events
  graphql:
    enabled: true
    auto-fetchers: true
  security:
    field-authorization-enabled: true
    depth-limit-enabled: true
    max-query-depth: 10
    complexity-limit-enabled: true
    max-query-complexity: 150
  metrics:
    enabled: true

logging:
  level:
    com.graphorm: DEBUG
